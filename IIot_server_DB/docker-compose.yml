name: iiot_rfid_server_db 
# ชื่อโปรเจคเริ่มต้น และอ้างอิงไปยัง volumes อันเดิม เพราะ Volume ที่เก็บ Postgres ถูกสร้างขึ้นในชื่อ: iiot_rfid_server_db_pgdat หรือก็คือ ชื่อ Volume จริง = <ชื่อโปรเจกต์>_<ชื่อ_volume>"

services:
  mqtt-broker: 
    image: iegomez/mosquitto-go-auth:latest
    container_name: mqtt-broker
    ports: 
      - "${portMqtt}:1884" 
    volumes:
      - ./mosquitto.conf:/etc/mosquitto/mosquitto.conf
    networks:
      - mqttServer
    depends_on:
      - postgres-db
      - redis-cache
        
  backend:
    build: .
    container_name: backend-api
    env_file:
      - .env
    environment:
      # override ค่าใน .env ให้ชี้ไปที่ชื่อ service ภายใน Docker network
      DB_HOST: postgres-db
      REDIS_URL: redis://redis-cache:6379
      #1883 เพื่อเข้า mqtt แบบไม่ต้องใส่หรัส
      MQTT_BROKER_URL: mqtt://mqtt-broker:1883
    ports:
      - "${PORT}:3000"
      # เพิ่ม 2 ส่วนนี้เพื่อทำ Live Reload
    volumes:
      - ./:/app            # ผูกโฟลเดอร์โปรเจกต์ปัจจุบัน เข้ากับโฟลเดอร์ /app ใน Container
      - /app/node_modules  # ป้องกันไม่ให้ node_modules ของ Windows ไปทับของ Linux
    command: sh -c "npm install && npm run dev"
    networks:
      - mqttServer
    depends_on:
      - mqtt-broker
      - postgres-db
      - redis-cache

  postgres-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Bangkok                 #ซิ้งเวลาไทย กับ container
      PGTZ: Asia/Bangkok                #ซิ้งเวลาไทย กับ pg
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - mqttServer

  redis-cache:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - mqttServer

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - postgres-db
    networks:
      - mqttServer

volumes:
  pgdata:

networks:
  mqttServer:
    driver: bridge